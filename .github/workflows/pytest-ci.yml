name: PyTest CI with .NET Backend

on:
  push:
    branches: [ '**' ]  # Run on push to any branch
  pull_request:
    branches: [ '**' ]  # Run on pull request to any branch
  workflow_dispatch:

jobs:
  # Job 1: Unit tests (no backend needed)
  unit-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run unit tests with coverage
      run: |
        cd backend
        pytest test_unit.py -v -m unit --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: py-${{ matrix.python-version }}
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-py${{ matrix.python-version }}
        path: |
          backend/htmlcov/
          backend/reports/
          backend/coverage.xml

  # Job 2: Integration tests with .NET backend
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore .NET dependencies
      run: |
        cd backend
        dotnet restore
    
    - name: Build .NET backend
      run: |
        cd backend
        dotnet build --configuration Release --no-restore
    
    - name: Start .NET API in background
      run: |
        cd backend
        nohup dotnet run --no-build --configuration Release > api.log 2>&1 &
        echo $! > api_pid.txt
        echo "Started .NET API with PID: $(cat api_pid.txt)"
    
    - name: Wait for API to be ready
      run: |
        echo "Waiting for API to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8080/games > /dev/null 2>&1; then
            echo "API is ready!"
            exit 0
          fi
          echo "Attempt $i: API not ready yet, waiting..."
          sleep 2
        done
        echo "API failed to start. Checking logs..."
        cat backend/api.log
        exit 1
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run integration tests
      run: |
        cd backend
        pytest test_api_endpoints.py -v -m integration --cov=game_service --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Show API logs
      if: always()
      run: |
        echo "=== .NET API Logs ==="
        cat backend/api.log || echo "No logs found"
    
    - name: Stop .NET API
      if: always()
      run: |
        if [ -f backend/api_pid.txt ]; then
          PID=$(cat backend/api_pid.txt)
          echo "Stopping API with PID: $PID"
          kill $PID || true
        fi
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          backend/reports/
          backend/htmlcov/
          backend/api.log

  # Job 3: Combined coverage report
  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run all tests for coverage
      run: |
        cd backend
        pytest test_unit.py -v --cov=. --cov-report=html --cov-report=term --cov-report=json
    
    - name: Display coverage summary
      run: |
        cd backend
        echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Upload final coverage report
      uses: actions/upload-artifact@v4
      with:
        name: final-coverage-report
        path: |
          backend/htmlcov/
          backend/coverage.json
