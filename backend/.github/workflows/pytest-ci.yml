name: PyTest CI with Coverage

on:
  push:
    branches: [ '**' ]  # Run on push to any branch
  pull_request:
    branches: [ '**' ]  # Run on pull request to any branch
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run unit tests with coverage
      run: |
        cd backend
        pytest test_unit.py -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Run linting (optional)
      continue-on-error: true
      run: |
        cd backend
        pip install flake8
        flake8 game_service.py --max-line-length=100 --ignore=E501,W503
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          backend/htmlcov/
          backend/reports/
          backend/coverage.xml
    
    - name: Generate test summary
      if: always()
      run: |
        cd backend
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pytest test_unit.py --co -q | head -20 >> $GITHUB_STEP_SUMMARY || true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: |
        cd backend
        dotnet restore
    
    - name: Build project
      run: |
        cd backend
        dotnet build --no-restore
    
    - name: Wait for PostgreSQL to be ready
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..30}; do
          if nc -z localhost 5432; then
            echo "PostgreSQL port is open!"
            sleep 2
            echo "PostgreSQL is ready!"
            exit 0
          fi
          echo "Attempt $i: PostgreSQL not ready yet, waiting..."
          sleep 2
        done
        echo "PostgreSQL failed to start"
        exit 1
    
    - name: Start .NET API (background)
      env:
        ConnectionStrings__PostgresConnection: "Host=localhost;Port=5432;Database=testdb;Username=testuser;Password=testpass"
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: "http://localhost:8080"
      run: |
        cd backend
        echo "Starting .NET API with connection string..."
        dotnet run --no-build > api.log 2>&1 &
        echo $! > api_pid.txt
        echo "API started with PID $(cat api_pid.txt)"
        sleep 15
    
    - name: Check API logs
      if: always()
      run: |
        cd backend
        if [ -f api.log ]; then
          echo "=== API Logs ==="
          cat api.log
        fi
    
    - name: Wait for API to be ready
      run: |
        echo "Waiting for API to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8080/games > /dev/null 2>&1; then
            echo "API is ready!"
            exit 0
          fi
          echo "Attempt $i: API not ready yet, waiting..."
          sleep 2
        done
        echo "API failed to start. Checking logs..."
        cd backend
        if [ -f api.log ]; then
          echo "=== Final API Logs ==="
          tail -100 api.log
        fi
        exit 1
    
    - name: Run integration tests
      run: |
        cd backend
        pytest test_api_endpoints.py -v -m integration || true
    
    - name: Stop .NET API
      if: always()
      run: |
        if [ -f backend/api_pid.txt ]; then
          kill $(cat backend/api_pid.txt) || true
        fi
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: backend/reports/

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Generate coverage report
      run: |
        cd backend
        pytest test_unit.py --cov=. --cov-report=html --cov-report=term
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/htmlcov/
    
    - name: Coverage summary
      run: |
        cd backend
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
