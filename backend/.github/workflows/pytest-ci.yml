name: PyTest CI with Coverage

on:
  push:
    branches: [ '**' ]  # Run on push to any branch
  pull_request:
    branches: [ '**' ]  # Run on pull request to any branch
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run unit tests with coverage
      run: |
        cd backend
        pytest test_unit.py -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing
    
    - name: Run linting (optional)
      continue-on-error: true
      run: |
        cd backend
        pip install flake8
        flake8 game_service.py --max-line-length=100 --ignore=E501,W503
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          backend/htmlcov/
          backend/reports/
          backend/coverage.xml
    
    - name: Generate test summary
      if: always()
      run: |
        cd backend
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        pytest test_unit.py --co -q | head -20 >> $GITHUB_STEP_SUMMARY || true

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Start .NET API (background)
      run: |
        cd backend
        dotnet run &
        echo $! > api_pid.txt
        sleep 10
    
    - name: Wait for API to be ready
      run: |
        timeout 30 bash -c 'until curl -s http://localhost:8080/health > /dev/null 2>&1; do sleep 2; done' || true
    
    - name: Run integration tests
      run: |
        cd backend
        pytest test_api_endpoints.py -v -m integration || true
    
    - name: Stop .NET API
      if: always()
      run: |
        if [ -f backend/api_pid.txt ]; then
          kill $(cat backend/api_pid.txt) || true
        fi
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: backend/reports/

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Generate coverage report
      run: |
        cd backend
        pytest test_unit.py --cov=. --cov-report=html --cov-report=term
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/htmlcov/
    
    - name: Coverage summary
      run: |
        cd backend
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY
