name: PyTest CI with Coverage
name: Backend CI Simplified

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show repository tree (top level)
        run: |
          ls -al
          echo "--- backend directory ---"
          ls -al backend || true

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest coverage requests

      - name: Pytest unit (with coverage)
        working-directory: backend
        run: |
          echo "Running unit tests..."
          if [ -f test_unit.py ]; then
            pytest test_unit.py -vv --maxfail=1 --cov=. --cov-report=term-missing --durations=25
          else
            echo "No unit tests file test_unit.py" && exit 1
          fi

      - name: Generate coverage XML/HTML artifacts
        working-directory: backend
        run: |
          coverage xml || true
          coverage html || true

      - name: Upload coverage + reports
        uses: actions/upload-artifact@v4
        with:
          name: python-unit-artifacts
          path: |
            backend/coverage.xml
            backend/htmlcov/
        if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    needs: python-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Build
        working-directory: backend
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Tool restore (EF CLI)
        working-directory: backend
        run: dotnet tool restore || true

      - name: Migrate DB
        working-directory: backend
        env:
          ConnectionStrings__PostgresConnection: "Host=localhost;Port=5432;Database=testdb;Username=testuser;Password=testpass"
        run: |
          dotnet ef database update --no-build --configuration Release || echo "EF migration skipped/failure (non-fatal)"

      - name: Start API
        working-directory: backend
        env:
          ConnectionStrings__PostgresConnection: "Host=localhost;Port=5432;Database=testdb;Username=testuser;Password=testpass"
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: "http://0.0.0.0:8080"
        run: |
          nohup dotnet run --no-build --configuration Release > api.log 2>&1 &
          echo $! > api.pid
          echo "Started API PID $(cat api.pid)"
          sleep 12
          tail -n 60 api.log || true

      - name: Health wait loop
        working-directory: backend
        run: |
          for i in {1..50}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then echo "API OK"; exit 0; fi
            echo "Attempt $i waiting for /health"; sleep 2;
          done
          echo "API NOT UP"; tail -n 120 api.log || true; exit 1

      - name: Setup Python (integration)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          pip install pytest requests

      - name: Run integration tests
        working-directory: backend
        env:
          BASE_URL: http://localhost:8080
        run: |
          if [ -f test_api_endpoints.py ]; then
            pytest test_api_endpoints.py -vv --tb=short || { echo "Integration tests failed"; tail -n 150 api.log || true; exit 1; }
          else
            echo "No integration test file"; exit 1
          fi

      - name: Dump final API log
        if: always()
        working-directory: backend
        run: |
          echo "=== API LOG (tail) ==="
          tail -n 200 api.log || true

      - name: Stop API
        if: always()
        working-directory: backend
        run: |
          if [ -f api.pid ]; then
            PID=$(cat api.pid)
            kill $PID || true
            sleep 2
            kill -9 $PID 2>/dev/null || true
          fi

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            backend/api.log
            backend/api.pid