name: Backend CI with Pytest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4
    
    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    # Restore .NET dependencies
    - name: Restore dependencies
      run: dotnet restore
    
    # Build the .NET backend
    - name: Build backend
      run: dotnet build --no-restore --configuration Release
    
    # Setup Python for pytest
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # Install Python dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Start the .NET backend in the background
    - name: Start backend server
      run: |
        dotnet run --no-build --configuration Release &
        echo $! > backend.pid
        sleep 10
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://localhost:5000
    
    # Wait for backend to be ready
    - name: Wait for backend to be ready
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:5000/health > /dev/null 2>&1 || curl -s http://localhost:5000 > /dev/null 2>&1; then
            echo "Backend is ready!"
            break
          fi
          echo "Waiting for backend... ($i/30) "
          sleep 2
        done
    
    # Run pytest tests
    - name: Run pytest
      run: |
        pytest -v --tb=short --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing --html=reports/test_report.html --self-contained-html
      continue-on-error: false
    
    # Stop the backend server
    - name: Stop backend server
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
        fi
    
    # Upload test results
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          reports/test_report.html
          htmlcov/
    
    # Upload coverage reports
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
